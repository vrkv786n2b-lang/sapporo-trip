<style>
:root{

  --walk:#7c879c; --subway:#2a6fdb; --tram:#1f9d63; --jr:#d7263d; --bus:#e8871e; --taxi:#c9a400; --car:#7b4fd6;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent2)}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:18px 18px 54px;position:relative;overflow:hidden}
header .snow{position:absolute;inset:0;pointer-events:none;opacity:.35}
header h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.5px;position:relative}
header .meta{font-size:13px;opacity:.85;margin-top:4px;position:relative;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sync{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);padding:2px 10px;border-radius:99px;font-size:12px}
.sync i{width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block}
.sync.on i{background:#4ade80}.sync.wait i{background:#facc15}.sync.off i{background:#f87171}
nav{position:sticky;top:0;z-index:20;margin:-40px 12px 0;background:var(--card);border-radius:var(--r);box-shadow:0 6px 24px rgba(20,33,61,.12);display:flex;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;border:0;background:none;padding:12px 14px;font-weight:700;color:var(--sub);font-size:14px;white-space:nowrap;border-bottom:3px solid transparent}
nav button.on{color:var(--navy);border-bottom-color:var(--accent)}
main{max-width:860px;margin:0 auto;padding:16px 12px 80px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(20,33,61,.06)}
.card h2{margin:0 0 10px;font-size:17px;font-weight:900;letter-spacing:-.3px}
.card h3{margin:14px 0 8px;font-size:15px}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:120px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(42,111,219,.12)}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;background:var(--navy);color:#fff;white-space:nowrap}
.btn.sec{background:#eaf0f8;color:var(--navy)}
.btn.red{background:#fde8eb;color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon{border:0;background:#f1f4f9;border-radius:8px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;color:var(--sub)}
.icon:hover{background:#e3e9f3}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;font-size:13px;font-weight:700;white-space:nowrap;color:var(--sub)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip small{font-weight:400;opacity:.8;margin-left:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:#f5f8fc;border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:18px;font-weight:900;color:var(--navy)}
.stat span{font-size:12px;color:var(--sub)}
.map{width:100%;border-radius:12px;background:#eef3f9;display:block}
.timeline{margin-top:10px}
.stop{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.num{flex:0 0 28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center}
.stop .body{flex:1;min-width:0}
.stop .name{font-weight:700;word-break:keep-all}
.stop .sub{font-size:12px;color:var(--sub)}
.stop .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.seg{margin:0 0 0 13px;border-left:3px dashed var(--line);padding:8px 0 8px 20px}
.seg .main{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:3px 9px;font-weight:700;font-size:13px;color:#fff}
.seg .detail{font-size:13px;color:var(--ink);margin-top:3px}
.seg .note{font-size:12px;color:var(--sub);margin-top:2px}
.alts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.alt{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;font-size:12px;text-align:left}
.alt.on{border-color:var(--navy);background:#eef2fa}
.picker{position:relative}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,33,61,.15);z-index:30;max-height:280px;overflow:auto}
.sugg button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-bottom:1px solid #f1f4f8}
.sugg button:hover,.sugg button.hl{background:#f3f7fd}
.sugg small{color:var(--sub);margin-left:6px}
.picked{font-size:13px;background:#eef6f1;color:#17663f;border-radius:8px;padding:6px 10px;margin-top:6px;display:flex;justify-content:space-between;gap:8px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--sub);font-weight:700}
td.r,th.r{text-align:right}
.bar{height:8px;border-radius:99px;background:#edf1f7;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent2)}
.check{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid #f1f4f8}
.check input{width:20px;height:20px;accent-color:var(--ok)}
.check.done .t{text-decoration:line-through;color:var(--sub)}
.check .t{flex:1}
.tag{font-size:11px;background:#eef2fa;color:var(--navy);border-radius:6px;padding:2px 7px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}
.empty{text-align:center;color:var(--sub);padding:22px 10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px;max-height:90vh;overflow:auto}

.field{margin-bottom:10px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:4px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:6px}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:4px;vertical-align:middle}
.clim td{text-align:center;padding:6px 2px;font-size:12px}
.clim tr.hl td{background:#fff4e5;font-weight:700}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px}
.kv b{color:var(--sub);font-weight:700;font-size:13px}
.warn{background:#fff7e6;color:#8a5a00;border-radius:10px;padding:8px 12px;font-size:13px;margin-top:8px}

function haversine(a,b){
  const R=6371,toR=x=>x*Math.PI/180;
  const dLat=toR(b.lat-a.lat),dLng=toR(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function roadKm(d){return d*(d<20?1.3:1.25)}
function subwayFare(km){return km<3?210:km<7?250:km<11?290:km<15?330:370}
function taxiFare(km){return Math.round((700+Math.max(0,km-1.3)*400)/10)*10}
function nearestStations(p){
  if(p.st&&p.st.length) return p.st;
  if(p.area!=='sapporo') return [];
  const out=[];
  for(const [k,s] of Object.entries(STATIONS)){
    if(haversine(p,{lat:s.p[0],lng:s.p[1]})<0.85) out.push(k);
  }
  return out;
}
function inferArea(lat,lng){
  let best=null,bd=1e9;
  for(const p of PLACES){const d=haversine({lat,lng},p);if(d<bd){bd=d;best=p}}
  const lim = best&&best.area==='sapporo'?8:6;
  return best&&bd<lim?best.area:'other';
}
function isWinter(){
  const s=state.settings.start; const m = s? Number(s.slice(5,7)) : (new Date().getMonth()+1);
  return m>=11||m<=3;
}
function subwayPlan(sa,sb){
  // sa, sb: 역 키 배열
  let best=null;
  for(const a of sa)for(const b of sb){
    if(a===b) continue;
    const la=STATIONS[a].l, lb=STATIONS[b].l;
    const common=la.find(x=>lb.includes(x));
    const cand = common? {a,b,line:common,transfer:false}:{a,b,line:la[0],line2:lb[0],transfer:true};
    if(!best || (best.transfer && !cand.transfer)) best=cand;
  }
  if(!best && sa.length && sb.length) return {same:true,a:sa[0]};
  return best;
}
function describeSubway(p){
  if(!p) return '지하철';
  if(p.same) return `같은 역(${STATIONS[p.a].n}) 주변이라 걸어서 이동`;
  const A=STATIONS[p.a].n,B=STATIONS[p.b].n;
  if(!p.transfer) return `${LINES[p.line].n} ${A} → ${B}`;
  const hub = (['N','H'].includes(p.line)&&['N','H'].includes(p.line2))?'오도리역 또는 삿포로역':'오도리역';
  return `${LINES[p.line].n} ${A} → ${hub} 환승 → ${LINES[p.line2].n} ${B}`;
}
function opt(k,m,fare,d,n){return {k,m:Math.max(1,Math.round(m)),fare:fare??null,d:d||'',n:n||''}}

function recommend(a,b){
  const r=recommendBase(a,b);
  if(r.d>=1.5) r.opts.push(opt('tour',r.rk/(r.rk>30?65:35)*60+5,0,'예약한 투어 버스로 이동 (투어 요금에 포함)'));
  return r;
}
function recommendBase(a,b){
  const d=haversine(a,b), rk=roadKm(d), winter=isWinter();
  const walkSpeed = winter?3.6:4.4, walkLim = winter?0.9:1.2;
  const walkMin = rk/walkSpeed*60;
  const opts=[];
  const aA=a.area||inferArea(a.lat,a.lng), bA=b.area||inferArea(b.lat,b.lng);
  const hintB = b.h? `도착지 가는 법: ${b.h}`:'';
  const snow = winter? '겨울 눈길이라 평소보다 천천히 걷는 걸로 계산했어요':'';

  if(d<0.05){ return {d,rk,opts:[opt('walk',1,0,'같은 장소예요')]}; }

  if(aA===bA){
    if(aA==='sapporo'){
      const sa=nearestStations(a), sb=nearestStations(b);
      const sp = (sa.length&&sb.length)? subwayPlan(sa,sb):null;
      const subwayOk = sp && !sp.same;
      const tramOk = a.tr&&b.tr;
      const subMin = 7+rk/30*60+(sp&&sp.transfer?5:0);
      const taxiMin = rk/24*60+4;
      if(d<walkLim || (sp&&sp.same && d<2)){
        opts.push(opt('walk',walkMin,0,'걸어서 이동',snow));
        if(subwayOk && d>0.6) opts.push(opt('subway',subMin,subwayFare(rk),describeSubway(sp)));
        if(d>0.6) opts.push(opt('taxi',taxiMin,taxiFare(rk),'택시'));
      } else {
        if(subwayOk) opts.push(opt('subway',subMin,subwayFare(rk),describeSubway(sp),hintB));
        if(tramOk && !subwayOk) opts.push(opt('tram',5+rk/14*60,200,'노면전차 (순환선, 요금 균일)',hintB));
        if(!subwayOk && !tramOk && ((b.tr&&!sb.length&&sa.length)||(a.tr&&!sa.length&&sb.length))){
          opts.push(opt('subway',subMin+8,subwayFare(rk)+200,'지하철로 오도리·스스키노까지 간 뒤 노면전차로 환승',hintB));
        }
        const vA=VIA[a.id], vB=VIA[b.id];
        if(!subwayOk && ((vB&&(sa.length||vA))||(vA&&sb.length))){
          const vp=subwayPlan(vA?[vA]:sa, vB?[vB]:sb);
          if(vp&&!vp.same) opts.push(opt('subway',7+rk*0.8/30*60+15+(vp.transfer?5:0),subwayFare(rk)+230,describeSubway(vp)+(vB?' → 버스로 환승':''),hintB));
        }
        if(!subwayOk && !tramOk){
          if(rk<7) opts.push(opt('taxi',taxiMin,taxiFare(rk),'택시가 가장 편해요 (근처에 지하철역이 없어요)',hintB));
          opts.push(opt('bus',8+rk/18*60,null,'시내버스 (구글맵에서 노선 확인)',hintB));
          if(rk>=7) opts.push(opt('taxi',taxiMin,taxiFare(rk),'택시'));
        } else {
          opts.push(opt('taxi',taxiMin,taxiFare(rk),winter?'택시 (짐이 많거나 눈이 많이 올 때)':'택시'));
        }
        if(d<2.2) opts.push(opt('walk',walkMin,0,'걸어서 이동',snow));
      }
    } else {
      const lim = aA==='otaru'?2.2:walkLim;
      if(d<lim){
        opts.push(opt('walk',walkMin,0,aA==='otaru'?'운하·거리 구경하며 걷기 좋아요':'걸어서 이동',snow));
        if(d>0.8) opts.push(opt('taxi',rk/24*60+4,taxiFare(rk),'택시'));
      } else {
        const rural=['biei','furano','niseko','toya','shikotsu'].includes(aA);
        if(aA==='hakodate') opts.push(opt('tram',6+rk/14*60,null,'하코다테 시영 노면전차',hintB));
        if(rural){
          opts.push(opt('car',rk/40*60,null,winter?'렌터카 (눈길 운전 주의) 또는 투어버스':'렌터카',hintB));
          opts.push(opt('bus',10+rk/25*60,null,'노선버스 (운행 편수가 적어요, 시간표 꼭 확인)'));
          opts.push(opt('taxi',rk/35*60+4,taxiFare(rk),'택시'));
        } else {
          opts.push(opt('bus',8+rk/18*60,null,'노선버스',hintB));
          opts.push(opt('taxi',rk/26*60+4,taxiFare(rk),'택시'));
        }
      }
    }
    return {d,rk,opts};
  }

  const key=[aA,bA].sort().join('|');
  const known=ROUTES[key];
  if(known){
    for(const r of known) opts.push(opt(r.k,r.m,null,r.d,r.n||''));
    // 출발·도착이 역/터미널에서 멀면 안내
    const tail=[];
    if(a.h&&a.area!=='sapporo') tail.push(`출발지: ${a.h}`);
    if(b.h) tail.push(`도착지: ${b.h}`);
    if(tail.length) opts[0].n=[opts[0].n,...tail].filter(Boolean).join(' · ');
    if(!opts.some(o=>o.k==='car') && rk>15) opts.push(opt('car',rk/50*60,null,'렌터카'));
    return {d,rk,opts};
  }
  // 알려진 노선이 없을 때: 거리 기준
  if(rk<12){
    opts.push(opt('taxi',rk/28*60+4,taxiFare(rk),'택시',hintB));
    opts.push(opt('bus',10+rk/22*60,null,'노선버스 (구글맵에서 확인)'));
  } else {
    opts.push(opt('jr',25+rk/60*60,null,'JR 또는 고속버스 (구글맵에서 시간표 확인)',hintB));
    opts.push(opt('car',rk/50*60,null,winter?'렌터카 (눈길 운전 주의)':'렌터카'));
  }
  return {d,rk,opts};
}
function fmtKm(k){return k<1?Math.round(k*1000)+'m':(k<10?k.toFixed(1):Math.round(k))+'km'}
function fmtMin(m){m=Math.round(m);if(m<60)return m+'분';const h=Math.floor(m/60),r=m%60;return h+'시간'+(r?' '+r+'분':'')}
function gmapsDir(a,b,k){return `https://www.google.com/maps/dir/?api=1&origin=${a.lat},${a.lng}&destination=${b.lat},${b.lng}&travelmode=${MODES[k]?MODES[k].g:'transit'}`}
function gmapsSearch(q){return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q+' 札幌')}`}
function parseMapsLink(s){
  s=String(s||'').trim();
  if(/maps\.app\.goo\.gl|goo\.gl\/maps/i.test(s)) return {short:true};
  if(!/google\.[a-z.]+\/maps|^https?:\/\/maps\.google/i.test(s)) return null;
  const c=parseCoords(s); if(!c) return {nocoord:true};
  let name='';
  const m=s.match(/\/maps\/place\/([^/@?]+)/); if(m){try{name=decodeURIComponent(m[1].replace(/\+/g,' '))}catch(e){name=m[1].replace(/\+/g,' ')}}
  if(!name){const q=s.match(/[?&]query=([^&]+)/);if(q){try{name=decodeURIComponent(q[1].replace(/\+/g,' '))}catch(e){}}}
  if(/^-?\d+\.\d+,/.test(name)) name='';
  return {...c,name:name.trim()};
}
async function placeFromLink(info,fallbackName){
  const name=info.name||fallbackName||'새 장소';
  const same=state.places.find(x=>x.name===name&&Math.abs(x.lat-info.lat)<0.0005&&Math.abs(x.lng-info.lng)<0.0005);
  if(same) return {...same,custom:true};
  if(state.readOnly) return {name,lat:info.lat,lng:info.lng,area:inferArea(info.lat,info.lng),cat:'내 장소'};
  return await saveCustomPlace(name,{lat:info.lat,lng:info.lng});
}

const OLC_A='23456789CFGHJMPQRVWX';
const OLC_REF=[[/비에이|美瑛|biei/i,43.5885,142.467],[/후라노|富良野|furano/i,43.342,142.383],[/아사히카와|旭川|asahikawa/i,43.7627,142.3586],[/오타루|小樽|otaru/i,43.1979,140.9937],[/치토세|千歳|chitose/i,42.82,141.65],[/노보리베츠|登別|noboribetsu/i,42.496,141.145],[/하코다테|函館|hakodate/i,41.7735,140.7265],[/니세코|ニセコ|niseko|俱知安|kutchan/i,42.862,140.699],[/도야|洞爺|toya/i,42.564,140.819],[/조잔케이|定山渓|jozankei/i,42.968,141.163],[/기타히로시마|北広島|kitahiroshima/i,42.985,141.56]];
function olcEncodePrefix(lat,lng,len){
  lat=Math.min(89.9999,Math.max(-90,lat))+90; lng=((lng+180)%360+360)%360;
  let r=20,out='';
  for(let i=0;i<len/2;i++){const a=Math.floor(lat/r),b=Math.floor(lng/r);out+=OLC_A[a]+OLC_A[b];lat-=a*r;lng-=b*r;r/=20}
  return out;
}
function olcDecode(code){
  code=code.toUpperCase().replace('+','').replace(/0+$/,'');
  let lat=-90,lng=-180,r=20,i=0;
  for(;i<Math.min(code.length,10);i+=2){lat+=OLC_A.indexOf(code[i])*r;lng+=OLC_A.indexOf(code[i+1]||'2')*r;if(i+2<Math.min(code.length,10))r/=20}
  let la=r,lo=r;
  for(i=10;i<code.length;i++){const d=OLC_A.indexOf(code[i]);la/=5;lo/=4;lat+=Math.floor(d/4)*la;lng+=(d%4)*lo}
  return {lat:lat+la/2,lng:lng+lo/2};
}
function parsePlusCode(s){
  const m=String(s||'').match(/(?:^|[^0-9A-Z])([23456789CFGHJMPQRVWX]{2,8}\+[23456789CFGHJMPQRVWX]{0,7})(?![0-9A-Z])/i); if(!m) return null;
  let code=m[1].toUpperCase(); const sep=code.indexOf('+');
  if(sep<8){ // 짧은 코드: 근처 지명 기준으로 앞자리 채우기
    let ref=[43.0618,141.3545]; for(const [re,la,ln] of OLC_REF){if(re.test(s)){ref=[la,ln];break}}
    const pad=8-sep, res=Math.pow(20,2-pad/2), half=res/2;
    let c=olcDecode(olcEncodePrefix(ref[0],ref[1],pad)+code);
    if(ref[0]+half<c.lat) c.lat-=res; else if(ref[0]-half>c.lat) c.lat+=res;
    if(ref[1]+half<c.lng) c.lng-=res; else if(ref[1]-half>c.lng) c.lng+=res;
    return c;
  }
  return olcDecode(code);
}
function parseCoords(s){
  if(!s) return null; s=String(s).trim();
  let m=s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/); if(m) return {lat:+m[1],lng:+m[2]};
  m=s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/); if(m) return {lat:+m[1],lng:+m[2]};
  m=s.match(/(-?\d{1,3}\.\d+)\s*[, ]\s*(-?\d{1,3}\.\d+)/); if(m) return {lat:+m[1],lng:+m[2]};
  return parsePlusCode(s);
}

async function writeDoc(coll,id,data){
  // 화면에 먼저 반영
  const arr=state[coll]; const i=arr.findIndex(x=>x.id===id);
  const row={...data,id};

function subscribeAll(once){
  once=once||(()=>{});
  DB.doc('admin/fx').onSnapshot(s=>{ state.fx=s.exists?{...s.data()}:{}; render(); },()=>{});
  DB.doc('trip/settings').onSnapshot(s=>{
    state.settings = {...(s.exists? s.data() : {}), ...(pendingSettings||{})};
    if(!s.metadata.fromCache) once('settings');
    render();
  },e=>{ once('settings'); });
  for(const c of COLLS){
    DB.collection(c).onSnapshot(q=>{
      state[c]=q.docs.map(d=>({...d.data(),id:d.id}));
      if(!q.metadata.fromCache) once(c);
      render();
    },e=>{ once(c); if(e&&e.code==='revoked') setSync('off','연결 끊김'); });
  }
}

async function initDB(){

    document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadSnapshot(true)}); setInterval(()=>loadSnapshot(true),300000); return; }
  setSync('wait','이 기기에만 저장 중');
  if(!window.claude||!window.claude.use){ setSync('off','이 기기에만 저장'); return; }
  let db=null;
  try{ db=await window.claude.use('db'); }catch(e){ db=null; }
  if(!db){ setSync('off','이 기기에만 저장'); return; }
  DB=db; state.mode='cloud'; state.isOwner=false;
  setSync('wait','동기화 중');
  let pending=COLLS.length+1;
  const timer=setTimeout(()=>{ if(pending>0) setSync('off','연결이 늦어요'); },10000);
  const done=()=>{ pending--; if(pending<=0){ clearTimeout(timer); if(!state.readOnly) setSync('on','동행인과 공유 중'); } };
  const seen=new Set();
  const once=(k)=>{ if(!seen.has(k)){ seen.add(k); done(); } };
  try{ subscribeAll(once); }catch(e){ setSync('off','이 기기에만 저장'); DB=null; state.mode='local'; }
  try{
    const user=await window.claude.use('user');
    state.isOwner = user&&user.isOwner ? !!(await user.isOwner()) : false; ownerChecked=true; document.body.classList.toggle('notowner',!state.isOwner); render();

}

async function geoNominatim(q){

async function geoSearch(q){

  if(!res.length&&!/札幌|삿포로|sapporo/i.test(q)){ try{ res=await geoNominatim(q+' 札幌') }catch(e){} }

  res.sort((a,b)=>((b.lat>41&&b.lat<46&&b.lng>139&&b.lng<146)?1:0)-((a.lat>41&&a.lat<46&&a.lng>139&&a.lng<146)?1:0));

function localMatch(q){

  const toks=nm.split(/\s+/).filter(t=>t.length>=2);
  const ok=p=>{const k=(p.k||'').toLowerCase(), n=p.name.toLowerCase(), hay=n+' '+k;

  const all=allPlaces(), strong=p=>{const k=(p.k||'').toLowerCase(),n=p.name.toLowerCase();return n===nm||k.split(/\s+/).includes(nm)||(toks.length>1&&toks.every(t=>(n+' '+k).includes(t)))};

function computeRoute(pts,chosen){
  const segs=[];let km=0,min=0,fare=0,fareUnknown=false;
  for(let i=0;i<pts.length-1;i++){
    if(pts[i+1].noLoc){const o={k:'none',m:0,fare:0,d:'',n:''};segs.push({d:0,rk:0,opts:[o],o});continue}
    const r=recommend(pts[i],pts[i+1]);
    let o=r.opts.find(x=>x.k===chosen[i])||r.opts[0];
    segs.push({...r,o});
    km+=r.rk; min+=o.m; if(o.fare!=null) fare+=o.fare; else if(o.k!=='walk'&&o.k!=='car') fareUnknown=true;
  }
  return {segs,km,min,fare,fareUnknown};
}

const CAT_ICON={관광:'📸',맛집:'🍜',쇼핑:'🛍',온천:'♨️',교통:'🚉',숙소:'🏨','내 장소':'📍',카페:'☕',활동:'✨',식사:'🍽',투어:'🚐',휴식:'🛋',체크인:'🔑',기타:'📝',병원:'🏥'};
const NOTE_TYPES=['활동','식사','투어','체크인','휴식','쇼핑','기타'];
const DEFAULT_STAY={관광:60,맛집:60,쇼핑:90,온천:120,교통:10,숙소:0,'내 장소':60,카페:45,활동:60,식사:60,투어:300,휴식:30,체크인:20,기타:30};
const STAY_OPTS=[0,15,30,45,60,90,120,150,180,240,300,360,480,600];
const AIRPORT=PLACES.find(p=>p.id==='airport');
function tm(s){if(!s)return null;const m=/^(\d{1,2}):(\d{2})/.exec(s);return m?(+m[1])*60+(+m[2]):null}
function hm(m){if(m==null)return '--:--';m=Math.round(m);const over=m>=1440;m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')+(over?'(+1)':'')}
function stayLabel(m){return m===0?'잠깐 들름':fmtMin(m)}
function flightDay(f,fallback){
  if(f&&f.date&&state.settings.start){const n=Math.round((new Date(f.date)-new Date(state.settings.start))/864e5)+1;return n}
  return fallback;
}
function dayItems(day){
  const st=state.settings, list=stopsOf(day);
  const items=list.map(s=>{
    const base={stop:s,time:s.time||'',stay:(s.stay!==undefined&&s.stay!=='')?Number(s.stay):(DEFAULT_STAY[s.cat]??60),modeNext:s.modeNext};
    if(s.lat==null||s.lat===''){return {...base,name:s.name,noLoc:true,lat:null,lng:null}}
    return {...placeOfStop(s),...base};
  });
  const fo=st.flightOut||{}, fi=st.flightIn||{};
  if(fo.arr&&flightDay(fo,1)===day) items.unshift({...AIRPORT,name:'신치토세 공항 도착'+(fo.no?' · '+fo.no:''),virtual:'arr',time:fo.arr,stay:60,modeNext:st.arrMode||''});
  if(fi.dep&&flightDay(fi,dayCount())===day) items.push({...AIRPORT,name:'신치토세 공항 출발'+(fi.no?' · '+fi.no:''),virtual:'dep',dep:fi.dep,time:'',stay:0});
  // 장소 없는 일정은 바로 앞(없으면 뒤) 장소 위치를 빌려 씀
  let last=null; for(const it of items){ if(it.noLoc){ if(last){it.lat=last.lat;it.lng=last.lng;it.area=last.area} } else last=it; }
  let next=null; for(let i=items.length-1;i>=0;i--){const it=items[i]; if(it.noLoc&&it.lat==null){ if(next){it.lat=next.lat;it.lng=next.lng;it.area=next.area} } else if(!it.noLoc) next=it; }
  return items.filter(it=>it.lat!=null||it.noLoc).map(it=>it.lat==null?{...it,lat:AIRPORT.lat,lng:AIRPORT.lng,area:'airport',ghost:true}:it);
}
function computeSchedule(items){
  const rt=computeRoute(items,items.map(x=>x.modeNext));
  let cursor=null;
  const rows=items.map((it,i)=>{
    const travel=i>0?rt.segs[i-1].o.m:0;
    const leave=cursor;
    const est=cursor!=null?cursor+travel:null;
    const r={arrive:null,depart:null,fixed:false,late:0,wait:0,guess:false,leave,est};
    const ft=tm(it.time);
    if(it.virtual==='dep'){
      r.deadline=tm(it.dep)-120; r.arrive=est; r.depart=tm(it.dep);
      if(est!=null&&est>r.deadline) r.late=est-r.deadline;
      if(est!=null&&est<r.deadline) r.wait=r.deadline-est;
      return r;
    }
    if(ft!=null){
      r.arrive=ft; r.fixed=true;
      if(est!=null&&est>ft) r.late=est-ft;
      if(est!=null&&est<ft) r.wait=ft-est;
    } else if(est!=null){ r.arrive=est; }
    else if(i===0){ r.arrive=9*60; r.guess=true; }
    if(r.arrive!=null){ const real=Math.max(r.arrive,est??r.arrive); r.depart=real+it.stay; cursor=r.depart; }
    return r;
  });
  return {rt,rows};
}
function timetableSVG(items,sch){

  items.forEach((it,i)=>{
    const r=sch.rows[i];
    if(i>0&&r.leave!=null&&r.est!=null&&r.est>r.leave) blocks.push({s:r.leave,e:r.est,k:sch.rt.segs[i-1].o.k,label:MODES[sch.rt.segs[i-1].o.k].i+' '+fmtMin(r.est-r.leave),travel:true});
    if(r.arrive!=null){
      const s=Math.max(r.arrive,r.est??r.arrive);
      if(it.virtual==='dep') blocks.push({s:r.est??r.deadline,e:r.depart,label:'✈️ 공항 수속·출발 '+hm(r.depart),air:true});
      else if(it.virtual==='arr') blocks.push({s:r.arrive,e:r.depart,label:'✈️ 도착 '+hm(r.arrive)+' · 입국·짐 찾기',air:true});
      else blocks.push({s,e:Math.max(s+10,r.depart),label:(i+1)+'. '+it.name,late:r.late>0});
    }
  });
  if(!blocks.length) return '';
  const start=Math.floor(Math.min(...blocks.map(b=>b.s))/60)*60, end=Math.ceil(Math.max(...blocks.map(b=>b.e))/60)*60;
  const PH=46, W=640, L=52, H=(end-start)/60*PH+16;
  const y=m=>8+(m-start)/60*PH;
  let g='';
  for(let h=start;h<=end;h+=60) g+=`<line x1="${L}" x2="${W}" y1="${y(h)}" y2="${y(h)}" stroke="#e3e8f0"/><text x="${L-8}" y="${y(h)+4}" text-anchor="end" font-size="11" fill="#5f6b82">${hm(h)}</text>`;
  for(const b of blocks){
    const top=y(b.s),hh=Math.max(4,y(b.e)-top);
    if(b.travel){
      g+=`<rect x="${L+10}" y="${top}" width="10" height="${hh}" rx="4" fill="${MODE_HEX[b.k]}"/>${hh>12?`<text x="${L+28}" y="${top+hh/2+4}" font-size="11" fill="${MODE_HEX[b.k]}" font-weight="700">${esc(b.label)}</text>`:''}`;
    } else {
      const fill=b.air?'#fde8eb':b.late?'#fff1f2':'#e8eefb', stroke=b.air?'#d7263d':b.late?'#d7263d':'#2a6fdb';
      g+=`<rect x="${L+130}" y="${top+1}" width="${W-L-136}" height="${hh-2}" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="1.2"/>${hh<13?'':''}<text ${hh<13?'display="none"':''} x="${L+140}" y="${top+Math.min(hh/2+4,18)}" font-size="12" font-weight="700" fill="#14213d">${esc(b.label.length>30?b.label.slice(0,29)+'…':b.label)}${hh>=30?'':''}</text>${hh>=32?`<text x="${L+140}" y="${top+34}" font-size="11" fill="#5f6b82">${hm(b.s)} ~ ${hm(b.e)}</text>`:''}`;
    }
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block" role="img" aria-label="시간표">${g}</svg>`;
}

function dayTheme(day){

const PLAN_PRESET={1:'arrival',2:'otaru',3:'city'};
function coursePts(c){return c.s.map(([id,stay])=>{const p=PLACES.find(x=>x.id===id);return {...p,stay}})}
function viewCourse(){
  const n=dayCount();
  const dayOpts=sel=>Array.from({length:n},(_,i)=>`<option value="${i+1}" ${i+1===sel?'selected':''}>${dayLabel(i+1)}${stopsOf(i+1).length?` · ${stopsOf(i+1).length}곳`:''}</option>`).join('');
  const fi=state.settings.flightIn||{};
  return `
  <div class="card">
    <h2>⭐ 우리 일정 맞춤 추천</h2>
    <p class="muted" style="margin-top:-4px">3박 4일, 첫날 오전 도착 기준이에요. 마지막 날은 ${fi.dep?`${esc(fi.dep)} 출발이라 `:''}공항 이동만 두었어요.</p>
    <table>${[1,2,3,4].filter(d=>d<=n).map(d=>{const c=COURSES.find(x=>x.id===PLAN_PRESET[d]);return `<tr><td style="white-space:nowrap"><b>${dayLabel(d)}</b></td><td>${c?esc(c.t):'숙소 → 신치토세 공항'}</td></tr>`}).join('')}</table>
    <div class="row needwrite" style="margin-top:10px"><button class="btn" data-preset-all>이대로 일정 채우기</button><span class="muted">비어 있는 날에만 넣어요</span></div>
  </div>
  ${COURSES.map(c=>{
    const pts=coursePts(c); const rt=computeRoute(pts,[]);
    const stayTot=c.s.reduce((a,x)=>a+x[1],0);
    return `<div class="card">
      <div class="row" style="gap:6px">${c.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
      <h2 style="margin-top:8px">${esc(c.t)}</h2>
      <p style="margin:0 0 8px">${esc(c.d)}</p>
      <details><summary class="muted" style="cursor:pointer">지도와 동선 보기 · ${c.s.length}곳 · 이동 ${fmtKm(rt.km)} · 약 ${fmtMin(rt.min+stayTot)}</summary>
        <div style="margin-top:8px">${mapSVG(pts,rt.segs.map(s=>s.o.k))}</div>
        <ol style="padding-left:20px;margin:8px 0">${c.s.map(([id,stay,memo],i)=>{const p=PLACES.find(x=>x.id===id);const sg=rt.segs[i];return `<li><b>${esc(p.name)}</b> <span class="muted">${stayLabel(stay)}${memo?' · '+esc(memo):''}</span>${sg?`<div class="muted" style="font-size:12px">↓ ${MODES[sg.o.k].i} ${MODES[sg.o.k].l} ${fmtKm(sg.rk)} · 약 ${fmtMin(sg.o.m)}</div>`:''}</li>`}).join('')}</ol>
      </details>
      <div class="row needwrite" style="margin-top:10px"><select data-course-day="${c.id}" style="width:auto">${dayOpts(Math.min(n,2))}</select><button class="btn" data-course-add="${c.id}">일정에 넣기</button></div>
    </div>`}).join('')}
  <p class="muted">코스의 이동 시간은 추정치예요. 넣은 뒤 일정 탭에서 순서·시간·체류 시간을 자유롭게 바꿀 수 있어요.</p>`;
}
async function addCourse(id,day){
  const c=COURSES.find(x=>x.id===id); if(!c) return;
  const hasArrival=(()=>{const fo=state.settings.flightOut||{};return fo.arr&&flightDay(fo,1)===day})();
  const startEmpty=!stopsOf(day).length;
  let first=true;
  for(const [pid,stay,memo] of c.s){
    const p=PLACES.find(x=>x.id===pid);
    const time=(first&&startEmpty&&c.start&&!hasArrival)?c.start:'';
    await addStop(day,p,time,memo,stay);
    first=false;
  }
}

const EXP_CATS=['식비','교통','숙소','쇼핑','관광','기타'];
function settle(){
  const ms=members(); const bal={}; ms.forEach(m=>bal[m]=0);
  let total=0;
  for(const e of state.expenses){
    const krw=toKRW(Number(e.amount)||0,e.cur,effRate(e)); total+=krw;
    const split=(e.split&&e.split.length?e.split:ms).filter(x=>ms.includes(x));
    if(ms.includes(e.paidBy)) bal[e.paidBy]+=krw;
    const share=split.length?krw/split.length:0;
    split.forEach(m=>bal[m]-=share);
  }
  const cred=Object.entries(bal).filter(([,v])=>v>1).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  const debt=Object.entries(bal).filter(([,v])=>v<-1).map(([k,v])=>({k,v:-v})).sort((a,b)=>b.v-a.v);
  const tx=[];let i=0,j=0;
  while(i<debt.length&&j<cred.length){
    const x=Math.min(debt[i].v,cred[j].v);
    tx.push({from:debt[i].k,to:cred[j].k,amt:x});
    debt[i].v-=x;cred[j].v-=x;
    if(debt[i].v<1)i++; if(cred[j].v<1)j++;
  }
  return {bal,tx,total};
}

function dayText(day){
  const items=dayItems(day); if(!items.length) return `[${dayLabel(day)}]\n(일정 없음)`;
  const sch=computeSchedule(items), rt=sch.rt; const lines=[`[${dayLabel(day)}]`];
  items.forEach((it,i)=>{
    const r=sch.rows[i], s=it.stop;
    if(i>0){const sg=rt.segs[i-1]; if(sg&&sg.o.k!=='none'&&!(it.noLoc)) lines.push(`   ↓ ${MODES[sg.o.k].i} ${MODES[sg.o.k].l} ${fmtMin(sg.o.m)}${sg.rk>=0.3?` (${fmtKm(sg.rk)})`:''}`);}
    if(it.virtual==='arr') lines.push(`${hm(r.arrive)} ✈️ ${it.name}`);
    else if(it.virtual==='dep') lines.push(`${hm(r.deadline)}까지 공항 도착 → ${hm(r.depart)} ✈️ ${it.name}`);
    else{
      const t=r.arrive!=null?`${hm(r.arrive)}~${hm(r.depart)}`:'시간 미정';
      lines.push(`${t} ${CAT_ICON[s.cat]||'📍'} ${s.name}${s.kind==='note'&&s.placeName?` @${s.placeName}`:''}`);
      if(s.memo) lines.push(`   📝 ${s.memo}`);
    }
  });
  const located=items.filter(x=>!x.noLoc);
  if(located.length>1) lines.push(`🗺 지도: ${gmapsAll(located)}`);
  return lines.join('\n');
}

let drag=null;
function dragTarget(clientY){
  const others=drag.items.filter(x=>x!==drag.item);
  for(const o of others){const r=o.getBoundingClientRect(); if(clientY<r.top+r.height/2) return o;}
  return null;
}
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('[data-drag]'); if(!h||state.readOnly) return;
  e.preventDefault();
  const item=h.closest('.item'), tl=h.closest('.timeline'); if(!item||!tl) return;
  const before=item.getBoundingClientRect();
  tl.classList.add('dragging'); document.body.classList.add('is-dragging');
  const after=item.getBoundingClientRect();
  if(Math.abs(after.top-before.top)>2) window.scrollBy(0,after.top-before.top);
  const r=item.getBoundingClientRect();
  drag={id:item.dataset.sid,item,tl,items:[...tl.querySelectorAll('.item[data-sid]')],grab:e.clientY-r.top,y:e.clientY,startOrder:[...tl.querySelectorAll('.item[data-sid]')].map(x=>x.dataset.sid),pending:false};
  item.classList.add('drag');
  try{h.setPointerCapture(e.pointerId)}catch(err){}
  if(navigator.vibrate) try{navigator.vibrate(15)}catch(err){}
},{passive:false});
function dragMove(clientY){
  if(!drag) return; drag.y=clientY;
  const tgt=dragTarget(clientY);
  const last=drag.items.filter(x=>x!==drag.item).slice(-1)[0];
  if(tgt){ if(drag.item.nextElementSibling!==tgt) drag.tl.insertBefore(drag.item,tgt); }
  else if(last&&last.nextElementSibling!==drag.item) last.after(drag.item);
  drag.item.style.transform='';
  const nat=drag.item.getBoundingClientRect().top;
  drag.item.style.transform=`translateY(${clientY-drag.grab-nat}px)`;
}
document.addEventListener('pointermove',e=>{ if(!drag) return; e.preventDefault(); dragMove(e.clientY); },{passive:false});
document.addEventListener('touchmove',e=>{ if(drag) e.preventDefault(); },{passive:false});
setInterval(()=>{ if(!drag) return; const m=70; if(drag.y<m){window.scrollBy(0,-12);dragMove(drag.y)} else if(drag.y>innerHeight-m){window.scrollBy(0,12);dragMove(drag.y)} },16);
async function endDrag(){
  if(!drag) return; const d=drag;
  const order=[...d.tl.querySelectorAll('.item[data-sid]')].map(x=>x.dataset.sid);
  d.item.style.transform=''; d.item.classList.remove('drag'); d.tl.classList.remove('dragging'); document.body.classList.remove('is-dragging');
  drag=null;
  const changed=order.join()!==d.startOrder.join();
  if(!changed){ render(); return; }
  // 새 순서 저장 (화면은 바로, 저장은 차례로)
  const updates=[];
  order.forEach((id,i)=>{const st=state.stops.find(x=>x.id===id); if(st&&(st.order||0)!==i+1){ const {id:_,...rest}=st; updates.push([id,{...rest,order:i+1,modeNext:''}]); }});
  for(const [id,data] of updates){ const k=state.stops.findIndex(x=>x.id===id); if(k>=0) state.stops[k]={...data,id}; }
  persistLocal('stops'); renderFresh=true; render();
  if(DB){ for(const [id,data] of updates){ try{ await DB.collection('stops').doc(id).set(data); }catch(e){ handleWriteError(e); break; } } }
  toast('순서를 바꿨어요');
}

  if(d.shareAll!==undefined) return openShareText(0);
  if(d.shareDay!==undefined) return openShareText(state.day);
  if(d.shareCopy!==undefined){const ta=$('#shareText');try{await navigator.clipboard.writeText(ta.value);toast('복사했어요. 카톡에 붙여넣어 주세요')}catch(err){ta.removeAttribute('readonly');ta.focus();ta.select();try{document.execCommand('copy');toast('복사했어요. 카톡에 붙여넣어 주세요')}catch(e2){toast('글을 길게 눌러 전체 선택 후 복사해 주세요')}ta.setAttribute('readonly','')}return}
  if(d.mjFilter){state.mjFilter=d.mjFilter;return render()}
  if(d.mjPick){const c=MJ_CLINICS.find(x=>x.id===d.mjPick);if(c){const b=mjBook();b.clinic=c.name;if(c.url)b.url=c.url;saveLS('mjBook',b);state.mjView='book';renderFresh=true;render();window.scrollTo({top:0,behavior:'smooth'});toast(c.name+'을(를) 예약 정보에 담았어요')}return}
  if(d.mjView){state.mjView=d.mjView;renderFresh=true;return render()}
  if(d.cp!==undefined){const t2=MJCP[Number(d.cp)];try{await navigator.clipboard.writeText(t2);toast('복사했어요')}catch(e){toast('길게 눌러 복사해 주세요')}return}
  if(d.jpCopy!==undefined){const t2=jpPhrases()[Number(d.jpCopy)][1];try{await navigator.clipboard.writeText(t2);toast('복사했어요')}catch(e){toast('길게 눌러 복사해 주세요')}return}
  if(d.mjBookPlan!==undefined){const b=mjBook();if(!b.when)return toast('진료 날짜·시간을 먼저 넣어 주세요');const date=b.when.slice(0,10),time=b.when.slice(11,16);
    const st=state.settings.start;let day=1;if(st){day=Math.round((new Date(date)-new Date(st))/864e5)+1}
    if(day<1||day>dayCount())return toast('진료 날짜가 여행 기간(Day 1~'+dayCount()+') 밖이에요');
    await writeDoc('stops',uid(),{day,order:nextOrder(day),kind:'note',name:'마운자로 비대면 진료',cat:'기타',time,stay:30,memo:[b.clinic,b.method].filter(Boolean).join(' · '),lat:null,lng:null,area:'',pid:'',placeName:'',modeNext:''});return toast(dayLabel(day)+' 일정에 넣었어요')}
  if(d.mjAdd!==undefined){const day=Number($('#mjDay').value);await writeDoc('stops',uid(),{day,order:nextOrder(day),kind:'note',name:'마운자로 비대면 진료',cat:'기타',time:$('#mjTime').value||'',stay:30,memo:'처방전·영수증 챙기기',lat:null,lng:null,area:'',pid:'',placeName:'',modeNext:''});toast(`${dayLabel(day)} 일정에 넣었어요`);return}
  if(d.auth==='in') return fbLogin();
  if(d.auth==='out'){ try{ await fb.auth.signOut(); }catch(e){} return; }

  if(d.fbMemberDel){ try{ await fb.fs.doc('members/'+d.fbMemberDel).delete(); }catch(e){ toast('실패: '+(e.code||e.message)); } return; }

  if(d.copyInvite!==undefined){try{await navigator.clipboard.writeText(PAGE_URL);toast('초대 링크를 복사했어요')}catch(err){const el=$('#inviteUrl');if(el){el.focus();el.select()}toast('링크를 길게 눌러 복사해 주세요')}return}
  if(d.fxSave!==undefined){const v=Number($('#fxRate').value);if(!(v>=300&&v<=3000))return toast('100엔당 원화 금액을 넣어 주세요 (예: 850)');await saveFx(v);const el=$('#fxRate');if(el)el.value='';return}
  if(d.hotelSave!==undefined){const p=pickers.hotel;if(!p||!p.sel)return toast('숙소를 검색해서 골라 주세요');const s=p.sel;const list=hotels().slice();
    const prevTo=list.length?Number(list[list.length-1].to||dayCount()):1;

    await saveSettings({hotels:list,hotel:null});p.sel=null;p.q='';render();return toast('숙소를 추가했어요')}
  if(d.hotelDel!==undefined){const list=hotels().slice();list.splice(Number(d.hotelDel),1);await saveSettings({hotels:list,hotel:null});return}
  if(d.hotelClear!==undefined){const {hotel,...rest}=state.settings;state.settings=rest;await saveSettings({});return}
  if(d.placeDel){await deleteDoc('places',d.placeDel);return}
  if(d.confirmYes!==undefined||d.confirmNo!==undefined){const r=d.confirmYes!==undefined;closeModal();confirmBox._res&&confirmBox._res(r);return}
});
function confirmBox2(msg,yes){
  return new Promise(res=>{confirmBox._res=res;
    $('#modalRoot').innerHTML=`<div class="modal"><div class="sheet"><p style="font-size:16px;margin-top:0">${esc(msg)}</p><div class="row"><button class="btn" data-confirm-yes>${esc(yes)}</button><button class="btn sec" data-confirm-no>취소</button></div></div></div>`;});
}
function confirmBox(msg){
  return new Promise(res=>{
    confirmBox._res=res;
    $('#modalRoot').innerHTML=`<div class="modal"><div class="sheet"><p style="font-size:16px;margin-top:0">${esc(msg)}</p><div class="row"><button class="btn red" data-confirm-yes>삭제</button><button class="btn sec" data-confirm-no>취소</button></div></div></div>`;
  });
}
document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(d.pkInput){
    const link=parseMapsLink(t.value);
    if(link&&link.lat!=null){const id=d.pkInput;(async()=>{const pl=await placeFromLink(link,'');toast(`구글맵 링크에서 “${pl.name}”을(를) 가져왔어요`);pickPlace(id,pl)})();return}
    if(!link&&parsePlusCode(t.value)&&/\+[23456789CFGHJMPQRVWX]{2}/i.test(t.value)){const c=parsePlusCode(t.value);const id=d.pkInput;const pc=(t.value.match(/[23456789CFGHJMPQRVWX]{2,8}\+[23456789CFGHJMPQRVWX]{0,7}/i)||[''])[0].toUpperCase();const nm=t.value.replace(pc,'').replace(/[23456789CFGHJMPQRVWX]{2,8}\+[23456789CFGHJMPQRVWX]{0,7}/i,'').replace(/[,，]/g,' ').replace(/(일본|日本|Japan|北海道|홋카이도|Hokkaido|\S*[市区]|\S*(시|구)\b|Sapporo|삿포로|札幌)/gi,'').trim();(async()=>{const pl=await placeFromLink({lat:c.lat,lng:c.lng,name:''},nm||('내 장소 '+pc));toast(`플러스 코드로 “${pl.name}” 위치를 잡았어요`);pickPlace(id,pl)})();return}
    if(link&&link.short||/maps\.app\.goo\.gl|goo\.gl\/maps/i.test(t.value)){return placeFromShare(d.pkInput,t.value)}
    if(link&&link.nocoord){const q=(t.value.match(/[?&](?:q|query)=([^&]+)/)||[])[1];if(q){let nm='';try{nm=decodeURIComponent(q.replace(/\+/g,' '))}catch(e){};const p=pickers[d.pkInput];p.q=nm;t.value=nm;return webSearchPicker(d.pkInput)}}
    const p=pickers[d.pkInput];p.q=t.value;p.open=true;p.hl=0;p.sel=null;p.manual=false;
    // 선택 해제 표시만 갱신
    const pk=t.closest('.picker');const pe=pk&&pk.querySelector('.picked');if(pe)pe.remove();const w=pk&&pk.querySelector('.warn');if(w)w.remove();
    return renderSugg(d.pkInput)}
  if(d.fl){
    const [k,f]=d.fl.split('.');
    if(f==='no') applyFlightNo(k,t.value,false);
    clearTimeout(flTimers[d.fl]);
    flTimers[d.fl]=setTimeout(()=>{ if(f==='no') applyFlightNo(k,t.value,true); else { const cur={...(state.settings[k]||{})}; if(cur[f]!==t.value){cur[f]=t.value; saveSettings({[k]:cur});} } },700);
    return;
  }
  if(d.pkCoord){const id=d.pkCoord;const link=parseMapsLink(t.value);const c=link&&link.lat!=null?link:parseCoords(t.value);
    if(c&&Math.abs(c.lat)<=90&&Math.abs(c.lng)<=180&&(link||/\d+\.\d{3,}\s*,\s*-?\d+\.\d{3,}/.test(t.value))){
      (async()=>{const p=pickers[id];const pl=await placeFromLink({lat:c.lat,lng:c.lng,name:p.q.trim()||(link&&link.name)||''},p.q.trim());toast(`“${pl.name}” 장소를 추가했어요`);pickPlace(id,pl)})();}
    return}
  if(d.mjb){const b=mjBook();b[d.mjb]=t.value;saveLS('mjBook',b);return}
  if(['mjPrice','mjQty','mjFee','mjKr'].includes(t.id)) return updateMJ();
  if(t.id==='exAmt'||t.id==='exCur'||t.id==='exRate') return updateExConv();
  if(t.id==='fxJ'){const k=$('#fxK');k.value=t.value?Math.round(Number(t.value)*rate()/100):'';return}
  if(t.id==='fxK'){const j=$('#fxJ');j.value=t.value?Math.round(Number(t.value)*100/rate()):'';return}
});
document.addEventListener('change',async e=>{
  const t=e.target,d=t.dataset;
  if(d.fl){const [k,f]=d.fl.split('.');const cur={...(state.settings[k]||{})};
    if(f==='no'){ await applyFlightNo(k,t.value,true); return; }
    else { cur[f]=t.value; if(f==='dep'||f==='arr'||f==='from'||f==='to'){ const hit=FLIGHT_TABLE[cur.no]; if(hit&&hit[f]!==undefined&&hit[f]!==t.value) cur.auto=false; } }
    await saveSettings({[k]:cur});return}
  if(d.stopTime||d.stopStay){const sid=d.stopTime||d.stopStay;const x=state.stops.find(z=>z.id===sid);if(x){const {id,...rest}=x;const patch=d.stopTime?{time:t.value}:{stay:Number(t.value)};await writeDoc('stops',id,{...rest,...patch})}return}
  if(d.set){let v=t.value;if(d.set==='rate'||d.set==='budget')v=v?Number(v):'';
    if(d.set==='start'&&state.settings.end&&v>state.settings.end){await saveSettings({start:v,end:v});return}
    await saveSettings({[d.set]:v});return}
  if(d.hotelFrom!==undefined||d.hotelTo!==undefined){const i=Number(d.hotelFrom??d.hotelTo);const list=hotels().map(h=>({...h}));if(!list[i])return;
    if(d.hotelFrom!==undefined)list[i].from=Number(t.value);else list[i].to=Number(t.value);
    if(list[i].from>list[i].to){if(d.hotelFrom!==undefined)list[i].to=list[i].from;else list[i].from=list[i].to}
    await saveSettings({hotels:list,hotel:null});return}
  if(d.mjSort!==undefined){state.mjSort=t.value;return render()}
  if(d.mj!==undefined){const m=mjDone();m[d.mj]=t.checked;saveLS('mjSteps',m);render();return}
  if(d.ck){const i=state.checklist.find(x=>x.id===d.ck);if(i){const {id,...rest}=i;await writeDoc('checklist',id,{...rest,done:t.checked})}return}
  if(t.id==='exCur') updateExConv();
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.pkInput){
    const id=t.dataset.pkInput,p=pickers[id];const n=(p.list||[]).length;
    if(e.key==='ArrowDown'){p.hl=Math.min(n,p.hl+1);renderSugg(id);e.preventDefault()}
    else if(e.key==='ArrowUp'){p.hl=Math.max(0,p.hl-1);renderSugg(id);e.preventDefault()}
    else if(e.key==='Enter'){e.preventDefault();if(p.list&&p.list[p.hl])pickPlace(id,p.list[p.hl]);else if(p.q.trim()){p.manual=true;p.open=false;render()}}
    else if(e.key==='Escape'){p.open=false;renderSugg(id)}
  }
  if(t.id==='ckText'&&e.key==='Enter'){document.querySelector('[data-check-add]').click()}
});
document.addEventListener('focusout',e=>{
  const t=e.target;if(t.dataset&&t.dataset.pkInput){const id=t.dataset.pkInput;setTimeout(()=>{const a=document.activeElement;if(pickers[id]&&!(a&&a.dataset&&a.dataset.pkInput===id)){pickers[id].open=false;renderSugg(id)}},180)}
});
document.addEventListener('mousedown',e=>{if(e.target.closest('.sugg'))e.preventDefault()});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.includes(h)&&h!==state.tab){state.tab=h;renderFresh=true;render()}});

/* 시작 */
loadLocal(); render(); initDB();
